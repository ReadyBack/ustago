name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ustago
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ustago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ustago" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      # CI-only throwaway values for the service containers above.
      DATABASE_URL: postgresql://ustago:ci-only-password@localhost:5432/ustago?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      SEED_DEV_PASSWORD: ci-only-seed-password
      # Phase 2: e2e tests read OTP codes from the in-memory fake SMS
      # provider and keep uploads in a temporary local directory.
      SMS_PROVIDER: fake
      STORAGE_DRIVER: local
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Secret scan and additive-migration guard
        run: |
          pnpm security:secrets
          pnpm db:migration-guard

      - name: Dependency audit (fails on critical)
        run: pnpm audit --prod --audit-level=critical

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production config guard (Faz 6)
        # A production process must refuse mock money, demo seed and test KYC,
        # and start with a complete (throwaway) production-shaped config.
        run: |
          if env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production APP_ENV=production \
              DATABASE_URL="$DATABASE_URL" REDIS_URL="$REDIS_URL" JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
              PAYMENT_PROVIDER=mock PAYOUT_PROVIDER=mock ALLOW_TEST_KYC=true \
              ALLOW_DEV_PAYMENT_SIMULATION=true DEMO_SEED=true pnpm -s config:check; then
            echo "::error::production config with mock providers was accepted"; exit 1
          fi
          R=ci-only-production-shaped-secret-0000000000
          env -i PATH="$PATH" HOME="$HOME" NODE_ENV=production APP_ENV=production \
            DATABASE_URL="$DATABASE_URL" REDIS_URL="$REDIS_URL" JWT_ACCESS_SECRET="$R-jwt" \
            OTP_HASH_SECRET="$R-otp" STORAGE_SIGNING_SECRET="$R-sto" IP_HASH_SECRET="$R-ip" \
            METRICS_TOKEN="$R-met" PAYMENT_PROVIDER=disabled PAYOUT_PROVIDER=disabled \
            SMS_PROVIDER=disabled PUSH_PROVIDER=disabled STORAGE_DRIVER=disabled \
            FINANCE_EARNING_HOLD_HOURS=72 FINANCE_MIN_PAYOUT_MINOR=10000 \
            ACCOUNT_DELETION_GRACE_HOURS=720 API_CORS_ORIGINS=https://admin.example.invalid \
            RECONCILIATION_INTERVAL_MINUTES=60 LOG_FORMAT=json API_SWAGGER_ENABLED=false \
            pnpm -s config:check

      - name: Prisma validate and migrate
        run: |
          pnpm db:validate
          pnpm db:deploy
          pnpm --filter @ustago/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed (twice, to prove it is idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: API e2e (real PostgreSQL + Redis)
        # A fresh database, like `ustago_test` locally: the demo seed above
        # must not add its own providers to the e2e scenarios.
        env:
          DATABASE_URL: postgresql://ustago:ci-only-password@localhost:5432/ustago_e2e?schema=public
        run: |
          pnpm db:deploy
          pnpm test:e2e
