name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ustago
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ustago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ustago" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      # CI-only throwaway values for the service containers above.
      DATABASE_URL: postgresql://ustago:ci-only-password@localhost:5432/ustago?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0000
      SEED_DEV_PASSWORD: ci-only-seed-password
      # Phase 2: e2e tests read OTP codes from the in-memory fake SMS
      # provider and keep uploads in a temporary local directory.
      SMS_PROVIDER: fake
      STORAGE_DRIVER: local
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prisma validate and migrate
        run: |
          pnpm db:validate
          pnpm db:deploy
          pnpm --filter @ustago/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Seed (twice, to prove it is idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: API e2e (real PostgreSQL + Redis)
        run: pnpm test:e2e
